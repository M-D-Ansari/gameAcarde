<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Production-Grade Multiplayer Arcade Minigame Suite">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GameHub Arcade">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GameHub Arcade Suite</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B0E14;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #00F2FE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .neon-spinner {
      border: 4px solid rgba(0, 242, 254, 0.1);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-left-color: #00F2FE;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="neon-spinner"></div>
    <h3 style="margin-top: 20px; letter-spacing: 2px;">LOADING GAMEHUB...</h3>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
