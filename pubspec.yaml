name: mini_arcade_hub
description: "Production-grade real-time multiplayer arcade suite with Flutter, Flame, and Firebase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Firebase Ecosystem
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_database: ^10.5.4
  google_sign_in: ^6.2.1

  # Game Engine & 2D Physics
  flame: ^1.16.0
  flame_forge2d: ^0.16.0

  # Deep Linking & Navigation
  app_links: ^6.1.1
  go_router: ^13.2.4

  # Utility & Animation
  uuid: ^4.4.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

